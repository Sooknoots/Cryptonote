# GitHub Actions workflow for automated GUI testing
name: GUI Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest  # Use Windows for Cryptonote

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-html pytest-cov pytest-xdist pyautogui

    - name: Create test directories
      run: |
        mkdir -p reports
        mkdir -p logs

    - name: Run unit tests
      run: |
        python run_tests.py --verbosity 2

    - name: Run GUI component tests
      run: |
        python run_gui_tests.py --gui-only --verbose
      env:
        CRYPTONOTE_TEST_MODE: 1

    - name: Run performance tests
      run: |
        python -m pytest tests/test_gui.py::PerformanceTestCase -v --tb=short

    - name: Generate coverage report
      run: |
        python -m pytest tests/ --cov=src --cov-report=html --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          reports/
          logs/
          htmlcov/

  smoke-test:
    runs-on: windows-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyautogui

    - name: Run smoke test
      run: |
        timeout 30 python Gui.py
      env:
        CRYPTONOTE_TEST_MODE: 1